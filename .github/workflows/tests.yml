name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # duopty relies on Windows-only APIs (ctypes.windll Recycle Bin, Tkinter),
    # so tests must run on a Windows runner rather than the default Linux one.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run test suite
        run: python -m unittest discover tests -v
